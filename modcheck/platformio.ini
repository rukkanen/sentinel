; DISPOSABLE bring-up scaffold (CLAUDE.md §4 exception) — "are the modules up?" check.
; Reads the INMP441 over I2S (SCK14/WS25/SD32) + the RCWL-0516 radar (GPIO27) and reports
; both live, so a wired module proves itself: make noise -> mic level jumps; move -> radar=1.
[platformio]
default_envs = esp32dev
[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
