; Throwaway diagnostic (NOT the protocol): stream every candidate GPIO so we can SEE
; which pin(s) the radar/mic are actually wired to. Digital pins use INPUT_PULLDOWN so a
; driven-HIGH sensor (radar) stands out against floating; ADC1 pins read the analog level
; (a mic/envelope wiggles with sound). Delete once the real pins are known.
[platformio]
default_envs = esp32dev
[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
