; DISPOSABLE bring-up scaffold (CLAUDE.md §4 exception) — learn the IR remote's button codes.
; Reads ONLY the IR receiver on GPIO4 and prints each button's NEC code. Not the real firmware:
; the industrial IR driver (SENT-004 sensor driver -> SENT-LINK event -> Pi handler) comes after.
[platformio]
default_envs = esp32dev
[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = z3t0/IRremote@^4.4.1
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
