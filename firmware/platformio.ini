; sentinel_module — the REAL firmware (Phase C, sentinel_module_spec).
; Two envs, one codebase: `esp32dev` builds/flashes the MCU; `native` host-runs the
; portable unit tests (lib/sentlink, curator…) with NO board — this is what makes
; spec→RED→GREEN work hands-off (spec SENT-160). `pio test -e native` needs a host
; C++ compiler: `sudo apt install build-essential`.
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; unique serial since the S68 reprogram — stable path:
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0

[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -Wall -Wextra
