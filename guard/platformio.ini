; DISPOSABLE bring-up scaffold (CLAUDE.md §4 exception) — a "canary" for live fault-watching
; while wiring is connected. Fast heartbeat + reset-reason banner so a brownout/short/reset is
; instantly visible on the Pi side (tools/fault_watch.py). Reads no sensor pins.
[platformio]
default_envs = esp32dev
[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
