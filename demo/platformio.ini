; SENTINEL rung-1 demo (prompt 14 Phase 0): blink + serial banner + command echo.
; This is the prove-the-board project, NOT the Sentinel firmware — that gets written
; in Phase C against the owner-accepted spec.

[platformio]
description = SENTINEL rung-1 demo: flash -> boot -> talk
default_envs = esp32dev

[env:esp32dev]
; Version pinned from the first successful build (2026-07-24, SETUP.md): resolves
; framework-arduinoespressif32 3.20017 + toolchain-xtensa-esp32 8.4.0+2021r2-patch5.
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; SAFETY: this bus also carries the Yahboom robot board (ttyUSB0) and the lidar.
; Never let pio auto-guess a port. /dev/sentinel_mcu is the (proposed) udev name;
; until that rule exists, pass the positively-identified port explicitly:
;   pio run -t upload --upload-port /dev/serial/by-id/<sentinel-device>
upload_port = /dev/sentinel_mcu
monitor_port = /dev/sentinel_mcu
