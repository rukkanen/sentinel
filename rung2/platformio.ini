; SENTINEL rung-2 (prompt 14): one/both sensors -> framed SENT-LINK events.
; Seeds the accepted protocol (sentinel_module_spec SENT-021): <ver><type><seq>|json|crc16\n.
; Reads radar GPIO12 + sound GPIO14 (spec SENT-002 seed pins — this IS the verification).

[platformio]
description = SENTINEL rung-2: sensor -> framed SENT-LINK event
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
; Stable path now that the CP2102 serial is unique (S68 reprogram). Override on
; the CLI if the board moves: pio run -t upload --upload-port <by-id/by-path>.
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
