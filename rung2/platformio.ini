; SENTINEL sensor-check (rung 2, updated S68): read ALL THREE wired sensors on the
; LOCKED pins and stream framed SENT-LINK events, so wiring + pins verify live on hardware.
;   mic A0  -> GPIO32 (analog loudness)   radar OUT -> GPIO27 (motion)   IR -> GPIO4 (NEC)
; Not the real firmware — a bring-up check. The curator (analyse/store) is a host-tested unit.

[platformio]
description = SENTINEL sensor-check: mic + radar + IR -> framed events
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = z3t0/IRremote@^4.4.1
upload_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
monitor_port = /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_sentinel_module-if00-port0
